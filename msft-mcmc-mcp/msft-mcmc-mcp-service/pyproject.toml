[project]
name = "msft-mcmc-mcp"
version = "0.1.0"
description = "Configurable MCP server for the Microsoft Copilot Studio demonstration"
readme = { text = "Configurable MCP server for the Microsoft Copilot Studio demonstration.", content-type = "text/markdown" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx2==2.13.0",
    "mcp==2.2.0",
    "msal>=1.34,<2",
    "pyjwt[crypto]==2.14.0",
    "uvicorn==0.53.0",
]

[project.scripts]
mcp = "mcmc_mcp.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.13,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcmc_mcp"]

[tool.mypy]
python_version = "3.12"
strict = true
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]